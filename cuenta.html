

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta | Poems_nath</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #100d10;
      color: #eee5e7;
      font-family: "DM Sans", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .caja {
      width: 100%;
      max-width: 430px;
      padding: 34px;
      background: #191318;
      border: 1px solid #38252e;
    }

    .logo {
      display: block;
      text-align: center;
      color: #e7bdc6;
      text-decoration: none;
      font: 28px "Cormorant Garamond", serif;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    .logo span {
      color: #a83d50;
    }

    .etiqueta {
      color: #d77d91;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    h1 {
      font: 40px "Cormorant Garamond", serif;
      font-weight: 400;
      margin: 12px 0;
    }

    .descripcion {
      color: #a99ba2;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .pestanas {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .pestanas button {
      flex: 1;
      padding: 12px 8px;
      background: transparent;
      color: #a99ba2;
      border: 1px solid #38252e;
      cursor: pointer;
      font: inherit;
    }

    .pestanas button.activa {
      color: white;
      background: #552431;
      border-color: #a83d50;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #d9a4b0;
      font-size: 12px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      background: #100d10;
      color: white;
      border: 1px solid #38252e;
      outline: none;
      font: inherit;
      border-radius: 2px;
    }

    input:focus {
      border-color: #a83d50;
    }

    .principal {
      width: 100%;
      margin-top: 5px;
      padding: 14px;
      color: white;
      background: #a83d50;
      border: 1px solid #a83d50;
      font: inherit;
      cursor: pointer;
    }

    .principal:hover {
      background: #c15368;
    }

    .principal:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .enlace {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #d9a4b0;
      background: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      width: 100%;
    }

    .mensaje {
      display: none;
      padding: 12px;
      margin-bottom: 18px;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .mensaje.visible {
      display: block;
    }

    .mensaje.error {
      background: #35171f;
      color: #ffc4ce;
      border: 1px solid #703142;
    }

    .mensaje.exito {
      background: #18271e;
      color: #c3f0d0;
      border: 1px solid #315840;
    }

    .volver {
      display: block;
      margin-top: 28px;
      text-align: center;
      color: #a99ba2;
      font-size: 12px;
      text-decoration: none;
    }

    .volver:hover,
    .enlace:hover {
      color: white;
    }

    @media (max-width: 420px) {
      .caja {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="caja">
    <a class="logo" href="index.html">versos<span>.</span></a>

    <span class="etiqueta">Poems_nath · Tu espacio</span>
    <h1 id="titulo">Bienvenida de nuevo.</h1>

    <p class="descripcion" id="descripcion">
      Inicia sesión para entrar a tu rincón de palabras.
    </p>

    <div class="pestanas">
      <button type="button" id="botonLogin" class="activa">
        Iniciar sesión
      </button>

      <button type="button" id="botonRegistro">
        Crear cuenta
      </button>
    </div>

    <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>

    <form id="formCuenta">
      <div class="campo" id="campoUsuario" hidden>
        <label for="usuario">Nombre de usuario</label>
        <input
          type="text"
          id="usuario"
          maxlength="30"
          autocomplete="username"
          placeholder="Ej. poeta_nocturna"
        >
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          required
          autocomplete="email"
          placeholder="tucorreo@ejemplo.com"
        >
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input
          type="password"
          id="contrasena"
          required
          minlength="6"
          autocomplete="current-password"
          placeholder="Mínimo 6 caracteres"
        >
      </div>

      <button class="principal" id="enviar" type="submit">
        Iniciar sesión
      </button>
    </form>

    <button class="enlace" id="recuperar" type="button">
      ¿Olvidaste tu contraseña?
    </button>

    <a class="volver" href="index.html">
      ← Volver a los poemas
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://bxgcdqfcrjmyokuesiah.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_4lYU49rF9YPA6QEkhlxlWA_0p4SS1w";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("formCuenta");
    const botonLogin = document.getElementById("botonLogin");
    const botonRegistro = document.getElementById("botonRegistro");
    const campoUsuario = document.getElementById("campoUsuario");
    const usuario = document.getElementById("usuario");
    const correo = document.getElementById("correo");
    const contrasena = document.getElementById("contrasena");
    const enviar = document.getElementById("enviar");
    const recuperar = document.getElementById("recuperar");
    const mensaje = document.getElementById("mensaje");

    let modo = "login";

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = "mensaje visible " + tipo;
    }

    function limpiarMensaje() {
      mensaje.textContent = "";
      mensaje.className = "mensaje";
    }

    function cambiarModo(nuevoModo) {
      modo = nuevoModo;
      limpiarMensaje();

      const registro = modo === "registro";

      botonLogin.classList.toggle("activa", !registro);
      botonRegistro.classList.toggle("activa", registro);
      campoUsuario.hidden = !registro;
      usuario.required = registro;

      document.getElementById("titulo").textContent =
        registro ? "Crea tu espacio." : "Bienvenida de nuevo.";

      document.getElementById("descripcion").textContent =
        registro
          ? "Crea una cuenta para empezar tu propio camino entre versos."
          : "Inicia sesión para entrar a tu rincón de palabras.";

      enviar.textContent =
        registro ? "Crear cuenta" : "Iniciar sesión";

      contrasena.autocomplete =
        registro ? "new-password" : "current-password";

      recuperar.style.display = registro ? "none" : "block";
    }

    botonLogin.addEventListener("click", () => cambiarModo("login"));
    botonRegistro.addEventListener("click", () => cambiarModo("registro"));

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      limpiarMensaje();

      const email = correo.value.trim();
      const password = contrasena.value;
      const nombre = usuario.value.trim();

      enviar.disabled = true;
      enviar.textContent = "Un momento...";

      try {
        if (modo === "registro") {
          if (nombre.length < 3) {
            mostrarMensaje(
              "Tu nombre de usuario debe tener al menos 3 caracteres.",
              "error"
            );
            return;
          }

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.origin +
                window.location.pathname.replace(/[^/]*$/, "cuenta.html"),
              data: {
                username: nombre
              }
            }
          });

          if (error) throw error;

          if (data.session) {
            window.location.href = "perfil.html";
            return;
          }

          mostrarMensaje(
            "¡Cuenta creada! Revisa tu correo y confirma tu dirección antes de iniciar sesión. Si no aparece, revisa la carpeta de spam.",
            "exito"
          );
        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          window.location.href = "perfil.html";
          return;
        }
      } catch (error) {
        mostrarMensaje(
          error.message || "Ocurrió un error. Inténtalo de nuevo.",
          "error"
        );
      } finally {
        enviar.disabled = false;
        enviar.textContent =
          modo === "registro" ? "Crear cuenta" : "Iniciar sesión";
      }
    });

    recuperar.addEventListener("click", async () => {
      limpiarMensaje();

      const email = correo.value.trim();

      if (!email) {
        mostrarMensaje(
          "Escribe tu correo electrónico primero.",
          "error"
        );
        correo.focus();
        return;
      }

      recuperar.disabled = true;

      try {
        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin +
              window.location.pathname.replace(/[^/]*$/, "cuenta.html")
          });

        if (error) throw error;

        mostrarMensaje(
          "Si el correo está registrado, recibirás un enlace para restablecer tu contraseña.",
          "exito"
        );
      } catch (error) {
        mostrarMensaje(error.message, "error");
      } finally {
        recuperar.disabled = false;
      }
    });

    async function revisarSesion() {
      const { data } = await supabaseClient.auth.getSession();

      if (data.session) {
        window.location.replace("perfil.html");
      }
    }

    cambiarModo("login");
    revisarSesion();

    const parametros = new URLSearchParams(window.location.search);

    if (parametros.get("confirmado") === "1") {
      mostrarMensaje(
        "Correo confirmado. Ahora puedes iniciar sesión.",
        "exito"
      );
    }
  </script>
</body>
</html>
